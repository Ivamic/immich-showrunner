# Diamonds: a black ground, the main frame across the top, the others in diamond frames.
# At most nine frames.
schema: 1
id: diamonds
version: 1
names: {en: Diamonds, de: Rauten, fr: Losanges, it: Rombi, ru: Ромбы}
max_frames: 9
fonts:
  title: {file: fonts/MarckScript-Regular.ttf}
  year: {file: fonts/Montserrat-Bold.ttf}

outputs:
  series_poster:
    size: [1000, 1500]
    design: [360, 540]
    background: &black {color: "#0B0B0B"}
    cell: &gem
      shape: diamond
      radius: 14
      border: {width: 3, color: "#6E6E6E"}
      shadow: {dx: 0, dy: 8, blur: 22, color: "#000000B3"}
    layouts:
      - cells: [{box: [6.79, 13.78, 86.42, 57.62]}]
        text: {area: [6, 0, 88, 94], align: center}
      - overlay: [{kind: linear, box: [0, 0, 100, 44], stops: [{at: 0, color: "#0B0B0B00"}, {at: 0.35, color: "#0B0B0B00"}, {at: 1, color: "#0B0B0BEB"}]}]
        text: {area: [6, 0, 88, 41]}
        cells:
          - {box: [0, 0, 100, 44], style: {shape: rect, radius: 0, border: null, shadow: null}}
          - {box: [9.11, 46.45, 44.0, 29.33]}
          - {box: [46.89, 59.41, 44.0, 29.33]}
      - overlay: [{kind: linear, box: [0, 0, 100, 42], stops: [{at: 0, color: "#0B0B0B00"}, {at: 0.35, color: "#0B0B0B00"}, {at: 1, color: "#0B0B0BEB"}]}]
        text: {area: [6, 0, 88, 39]}
        cells:
          - {box: [0, 0, 100, 42], style: {shape: rect, radius: 0, border: null, shadow: null}}
          - {box: [31.14, 42.98, 37.71, 25.14]}
          - {box: [10.03, 57.06, 37.71, 25.14]}
          - {box: [52.25, 57.06, 37.71, 25.14]}
          - {box: [31.14, 71.13, 37.71, 25.14]}
          - {box: [-11.08, 42.98, 37.71, 25.14]}
      - overlay: [{kind: linear, box: [0, 0, 100, 40], stops: [{at: 0, color: "#0B0B0B00"}, {at: 0.35, color: "#0B0B0B00"}, {at: 1, color: "#0B0B0BEB"}]}]
        text: {area: [6, 0, 88, 37]}
        cells:
          - {box: [0, 0, 100, 40], style: {shape: rect, radius: 0, border: null, shadow: null}}
          - {box: [31.14, 42.98, 37.71, 25.14]}
          - {box: [10.03, 57.06, 37.71, 25.14]}
          - {box: [52.25, 57.06, 37.71, 25.14]}
          - {box: [31.14, 71.13, 37.71, 25.14]}
          - {box: [-11.08, 42.98, 37.71, 25.14]}
          - {box: [73.37, 42.98, 37.71, 25.14]}
          - {box: [-11.08, 71.13, 37.71, 25.14]}
          - {box: [73.37, 71.13, 37.71, 25.14]}
    text: &title
      font: title
      color: "#FFFFFF"
      area: [6, 0, 88, 94]
      anchor: bottom
      align: left
      size: [26, 58]
      max_lines: 2
      line_height: 1.0
      shadow: {dx: 0, dy: 2, blur: 10, color: "#00000099"}

  season_poster:
    size: [1000, 1500]
    design: [360, 540]
    background: *black
    cell: *gem
    layouts:
      - cells: [{box: [6.79, 13.78, 86.42, 57.62]}]
        text: {area: [6, 0, 88, 94], align: center}
      - overlay: [{kind: linear, box: [0, 0, 100, 42], stops: [{at: 0, color: "#0B0B0B00"}, {at: 0.35, color: "#0B0B0B00"}, {at: 1, color: "#0B0B0BEB"}]}]
