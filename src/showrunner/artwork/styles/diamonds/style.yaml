          - {box: [71.1, 33.89, 18.12, 32.21]}
          - {box: [61.57, 50.84, 18.12, 32.21]}
      - cells:
          - {box: [0, 0, 50, 100], style: {shape: rect, radius: 0, border: null, shadow: null}}
          - {box: [52.03, 16.95, 18.12, 32.21]}
          - {box: [61.57, 33.89, 18.12, 32.21]}
          - {box: [52.03, 50.84, 18.12, 32.21]}
          - {box: [71.1, 16.95, 18.12, 32.21]}
          - {box: [71.1, 50.84, 18.12, 32.21]}
          - {box: [80.63, 33.89, 18.12, 32.21]}
    text:
      <<: *title
      area: [4, 0, 44, 93]
      size: [22, 48]
      max_lines: 3

  fanart:
    size: [1920, 1080]
    design: [640, 360]
    background: *black
    cell: *gem
    layouts:
      - cells:
          - {box: [3.95, 20.36, 22.1, 39.28]}
          - {box: [27.7, 20.36, 22.1, 39.28]}
          - {box: [51.45, 20.36, 22.1, 39.28]}
          - {box: [75.2, 20.36, 22.1, 39.28]}
          - {box: [-7.92, 41.47, 22.1, 39.28]}
          - {box: [15.83, 41.47, 22.1, 39.28]}
          - {box: [39.58, 41.47, 22.1, 39.28]}
          - {box: [63.33, 41.47, 22.1, 39.28]}
          - {box: [87.08, 41.47, 22.1, 39.28]}
      - cells:
          - {box: [-7.92, -11.31, 22.1, 39.28]}
          - {box: [15.83, -11.31, 22.1, 39.28]}
          - {box: [39.58, -11.31, 22.1, 39.28]}
          - {box: [63.33, -11.31, 22.1, 39.28]}
          - {box: [87.08, -11.31, 22.1, 39.28]}
          - {box: [3.95, 9.8, 22.1, 39.28]}
          - {box: [27.7, 9.8, 22.1, 39.28]}
          - {box: [51.45, 9.8, 22.1, 39.28]}
          - {box: [75.2, 9.8, 22.1, 39.28]}
          - {box: [-7.92, 30.91, 22.1, 39.28]}
          - {box: [15.83, 30.91, 22.1, 39.28]}
          - {box: [39.58, 30.91, 22.1, 39.28]}
          - {box: [63.33, 30.91, 22.1, 39.28]}
          - {box: [87.08, 30.91, 22.1, 39.28]}

  logo:
    size: [800, 310]
    design: [568, 220]
    text:
      font: title
      color: "#FFFFFF"
      area: [6, 4, 88, 92]
      anchor: center
      align: center
      size: [44, 100]
      max_lines: 2
      line_height: 1.0
      stroke: {width: 1, color: "#000000B3"}
