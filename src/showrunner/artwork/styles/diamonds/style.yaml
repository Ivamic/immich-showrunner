          - {box: [0, 0, 100, 42], style: {shape: rect, radius: 0, border: null, shadow: null}}
          - {box: [31.14, 42.98, 37.71, 25.14]}
          - {box: [10.03, 57.06, 37.71, 25.14]}
          - {box: [52.25, 57.06, 37.71, 25.14]}
    text:
      font: year
      color: "#FFFFFF"
      letter_spacing: 0.04
      area: [0, 0, 93, 96]
      anchor: bottom
      align: right
      size: [76, 76]
      max_lines: 1
      line_height: 1.0

  landscape:
    size: [1920, 1080]
    design: [640, 360]
    background: *black
    cell: *gem
    overlay:
      - {kind: linear, angle: 90, box: [0, 0, 50, 100], stops: [{at: 0, color: "#0B0B0B00"}, {at: 0.55, color: "#0B0B0B00"}, {at: 1, color: "#0B0B0BF2"}]}
      - {kind: linear, box: [0, 0, 50, 100], stops: [{at: 0, color: "#0B0B0B00"}, {at: 0.45, color: "#0B0B0B00"}, {at: 1, color: "#0B0B0BE6"}]}
