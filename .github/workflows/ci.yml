# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: showrunner
          POSTGRES_PASSWORD: showrunner
          POSTGRES_DB: showrunner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U showrunner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The tests drop everything in this database before they run.
      SHOWRUNNER_TEST_DATABASE_URL: postgresql+asyncpg://showrunner:showrunner@localhost:5432/showrunner_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact version tags only (no floating major tag).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: |
          uv run mypy
          uv run mypy tests
      - name: Tests
        run: uv run pytest
      - name: Licenses
        # Only licenses compatible with AGPL-3.0-or-later are allowed.
        run: >-
          uv run pip-licenses --partial-match --ignore-packages showrunner
          --allow-only "MIT;BSD;Apache;ISC;MPL;PSF;Python Software Foundation;HPND;LGPL;PostgreSQL"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - uses: actions/checkout@v7
      - name: compose.yaml works with only the required settings
        run: |
          printf 'SHOWRUNNER_IMMICH_URL=http://127.0.0.1:9
SHOWRUNNER_IMMICH_API_KEY=k
SHOWRUNNER_PATH_MAP=/data=/srv
SHOWRUNNER_OUTPUT_LOCATION=/tmp/out
DB_PASSWORD=ci
' > .env
          docker compose config -q
          # Without a required setting it stops with a clear message.
          grep -v SHOWRUNNER_PATH_MAP .env > /tmp/partial.env
          if docker compose --env-file /tmp/partial.env config -q 2>/tmp/err; then exit 1; fi
          grep -q "set SHOWRUNNER_PATH_MAP" /tmp/err
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: immich-showrunner:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts
        run: docker run --rm immich-showrunner:ci --version
